  seteffect: "&e/seteffect &7- Configurar fuegos artificiales en mano principal como efecto de confeti"
  reloadlanguage: "&e/reloadlanguage &7- Redetectar configuración de idioma"
  setlanguage: "&e/setlanguage <código> &7- Establecer idioma del plugin"
  language: "&e/language &7- Ver el idioma actual del plugin"