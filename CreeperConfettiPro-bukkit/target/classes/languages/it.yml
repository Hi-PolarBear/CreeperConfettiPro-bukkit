help:
  header: "&6=== Aiuto CreeperConfettiPro ==="
  reload: "&e/reload &7- Ricarica la configurazione del plugin"
  reseteffect: "&e/reseteffect &7- Ripristina l'effetto confetti predefinito"
  seteffect: "&e/seteffect &7- Imposta il fuoco d'artificio in mano principale come effetto confetti"
  reloadlanguage: "&e/reloadlanguage &7- Rileva le impostazioni lingua"
  setlanguage: "&e/setlanguage <codice> &7- Imposta la lingua del plugin"
  language: "&e/language &7- Visualizza la lingua attuale del plugin"